<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Latest Job Market Paper – Michelle Layvant</title>
  <script>
    // Make each visit request a fresh PDF, instead of a locally cached copy.
    const pdf = new URL('jmp.pdf', window.location.href);

    window.location.replace(pdf.toString());
  </script>
</head>

    <a href="jmp.pdf">Open the PDF directly</a>.</p>
</body>
